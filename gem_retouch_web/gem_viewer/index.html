<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#wrap { position: absolute; left: 0; top: 0; right: 0; bottom: 38px; display: flex; gap: 8px; }
.pane { position: relative; flex: 1; min-width: 0; overflow: hidden; background: #171b24;
  border-radius: 10px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.pane.heal { cursor: crosshair; }
.pane.drag { cursor: grabbing; }
.pane img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none;
  pointer-events: none; -webkit-user-drag: none; }
.pane canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.tag { position: absolute; left: 10px; top: 8px; font-weight: 600; z-index: 2; color: #e6e9ef; background: rgba(14,17,23,.7);
  padding: 2px 9px; border-radius: 6px; font-size: 12px; pointer-events: none; }
#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center;
  justify-content: center; gap: 5px; color: #9aa3b8; font-size: 12px; }
#bar button { background: #2a3142; color: #e6e9ef; border: 0; border-radius: 6px; min-width: 28px; height: 26px;
  cursor: pointer; font-size: 14px; }
#bar button:hover { background: #3a4358; }
#zl { min-width: 42px; text-align: center; color: #e6e9ef; }
body.light .pane { background: #d9dce4; }
body.light .tag { background: rgba(250,250,252,.9); color: #222733; }
body.light #bar { color: #667085; }
body.light #zl { color: #1a2030; }
body.light #bar button { background: #e6eaf4; color: #1a2030; }
#note { flex: 1 1 0; min-width: 0; text-align: right; padding-right: 10px; color: #9aa3b8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sp { flex: .3 1 0; }
body.light #note { color: #667085; }
#hint { display: none; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#bar button { white-space: nowrap; padding: 0 8px; }
#bar { flex-wrap: nowrap; overflow: hidden; }
</style>
</head>
<body>
<div id="wrap">
  <div class="pane" id="pa"><span class="tag" id="stn" style="left:10px;right:auto"></span><span class="tag" id="tag" style="left:auto;right:10px">Edited</span><img id="ia" draggable="false"><img id="ib" draggable="false"><canvas id="ca"></canvas></div>
</div>
<div id="bar">
  <span id="sp"></span><button id="zo" title="Zoom out">&minus;</button><span id="zl">100%</span><button id="zi" title="Zoom in">+</button>
  <button id="zr" title="Reset view">Fit</button><button id="fl" title="Flip Original / Edited">&#9251; Space: flip</button><span id="hint"></span><span id="note"></span>
</div>
<script>
(function () {
  var panes = [document.getElementById('pa')];
  var imgs = [document.getElementById('ia'), document.getElementById('ib')];   // original, edited (stacked)
  var cans = [document.getElementById('ca')];
  var tag = document.getElementById('tag');
  var showEdited = true, spaceDragged = false, spaceMode = 'tap', keepView = false, startEdited = true, holdActive = false;
  function applyFlip() {
    imgs[0].style.visibility = showEdited ? 'hidden' : 'visible';
    imgs[1].style.visibility = showEdited ? 'visible' : 'hidden';
    tag.textContent = showEdited ? 'Edited' : 'Original';
  }
  function flip() { showEdited = !showEdited; applyFlip(); }
  var ctxs = cans.map(function (c) { return c.getContext('2d'); });
  var label = document.getElementById('zl'), hint = document.getElementById('hint');

  var autoFit = false, fitOffset = 360, baseH = 520;
  function applyHeight() {
    var H = baseH;
    if (autoFit) { try {
      var pw = window.parent.innerWidth, ph = window.parent.innerHeight;
      H = pw < 900 ? Math.max(260, Math.min(Math.round(ph * 0.5), Math.round(pw * 1.05))) : Math.max(320, Math.round(ph - fitOffset));
    } catch (e) {} }
    setHeight(H);
  }
  try { window.parent.addEventListener('resize', function () { if (autoFit) applyHeight(); }); } catch (e) {}
  var MAXZ = 12, nw = 0, nh = 0;
  var z = 1, cxn = 0.5, cyn = 0.5;              // zoom and view centre (0..1 of the picture)
  var name = null, origId = null, editId = null;
  var mode = 'pan', brush = 16, argBrush = null, seen = [], pending = [], cur = null, hover = [null, null], space = false;
  var lastEnd = null;                          // end point of the previous stroke (for Shift + click lines)

  // ---- Streamlit component protocol (plain postMessage, no build step) ----
  function post(msg) { msg.isStreamlitMessage = true; window.parent.postMessage(msg, '*'); }
  function sendValue(v) { post({ type: 'streamlit:setComponentValue', value: v, dataType: 'json' }); }
  function setHeight(h) { post({ type: 'streamlit:setFrameHeight', height: h }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function scaleOf(p) { return Math.min(p.clientWidth / nw, p.clientHeight / nh) * z; }

  function render() {
    if (!nw || !nh) return;
    if (z <= 1.0001) { z = 1; cxn = 0.5; cyn = 0.5; }
    cxn = Math.min(Math.max(cxn, 0), 1);
    cyn = Math.min(Math.max(cyn, 0), 1);
    var p = panes[0], s = scaleOf(p);
    for (var i = 0; i < 2; i++) {
      imgs[i].style.transform = 'translate(' + (p.clientWidth / 2 - cxn * nw * s) + 'px,' +
        (p.clientHeight / 2 - cyn * nh * s) + 'px) scale(' + s + ')';
    }
    label.textContent = Math.round(z * 100) + '%';
    overlay();
  }

  function overlay() {
    if (!nw) return;
    var dpr = window.devicePixelRatio || 1;
    for (var i = 0; i < 1; i++) {
      var p = panes[i], c = cans[i], W = p.clientWidth, H = p.clientHeight;
      if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) {
        c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
        c.style.width = W + 'px'; c.style.height = H + 'px';
      }
      var g = ctxs[i];
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      var s = scaleOf(p), ox = W / 2 - cxn * nw * s, oy = H / 2 - cyn * nh * s;
      g.lineCap = 'round'; g.lineJoin = 'round';
      g.strokeStyle = 'rgba(255,70,70,0.45)';
      var list = pending.slice();
      if (cur) list.push(cur);
      list.forEach(function (st) {
        if (st.name !== name) return;
        g.lineWidth = Math.max(1, 2 * st.r * nw * s);
        g.beginPath();
        st.pts.forEach(function (pt, k) {
          var x = ox + pt[0] * nw * s, y = oy + pt[1] * nh * s;
          if (k === 0) { g.moveTo(x, y); if (st.pts.length === 1) g.lineTo(x + 0.01, y); }
          else g.lineTo(x, y);
        });
        g.stroke();
      });
      if (mode === 'heal' && hover[i]) {
        g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,0.9)';
        g.beginPath(); g.arc(hover[i][0], hover[i][1], Math.max(2, brush * s), 0, 6.2832); g.stroke();
      }
    }
  }

  function zoomAt(newz, p, mx, my) {
    newz = Math.min(Math.max(newz, 1), MAXZ);
    var W = p.clientWidth, H = p.clientHeight, s0 = scaleOf(p);
    var px = cxn * nw + (mx - W / 2) / s0, py = cyn * nh + (my - H / 2) / s0;   // image point under the cursor
    z = newz;
    var s1 = scaleOf(p);
    cxn = (px - (mx - W / 2) / s1) / nw;
    cyn = (py - (my - H / 2) / s1) / nh;
    render();
  }

  function toImg(p, e) {
    var r = p.getBoundingClientRect(), s = scaleOf(p);
    return [(cxn * nw + (e.clientX - r.left - p.clientWidth / 2) / s) / nw,
            (cyn * nh + (e.clientY - r.top - p.clientHeight / 2) / s) / nh];
  }

  panes.forEach(function (p, i) {
    var drag = null, ptrs = {}, pinch = null;
    p.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    p.addEventListener('pointerdown', function (e) {
      if (!nw) return;
      try { p.setPointerCapture(e.pointerId); } catch (_) {}
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(ptrs);
      if (ids.length === 2) {
        cur = null; drag = null;
        var a0 = ptrs[ids[0]], b0 = ptrs[ids[1]];
        pinch = { d: Math.hypot(a0.x - b0.x, a0.y - b0.y) || 1, z: z };
        return;
      }
      if (mode === 'heal' && e.button === 0 && !space) {
        var pt0 = toImg(p, e);
        if (e.shiftKey && lastEnd && lastEnd.name === name) {
          cur = { sid: uid(), name: name, r: brush / nw, pts: [lastEnd.pt, pt0], straight: true };
        } else {
          cur = { sid: uid(), name: name, r: brush / nw, pts: [pt0] };
        }
        overlay();
      } else {
        drag = { x: e.clientX, y: e.clientY };
        p.classList.add('drag');
      }
    });
    p.addEventListener('pointermove', function (e) {
      var r = p.getBoundingClientRect();
      if (ptrs[e.pointerId]) ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (pinch) {
        var ids2 = Object.keys(ptrs);
        if (ids2.length >= 2) {
          var a1 = ptrs[ids2[0]], b1 = ptrs[ids2[1]], d1 = Math.hypot(a1.x - b1.x, a1.y - b1.y) || 1;
          zoomAt(pinch.z * d1 / pinch.d, p, (a1.x + b1.x) / 2 - r.left, (a1.y + b1.y) / 2 - r.top);
        }
        return;
      }
      hover[i] = [e.clientX - r.left, e.clientY - r.top];
      if (cur && cur.straight) {
        cur.pts = [cur.pts[0], toImg(p, e)];
        overlay();
      } else if (cur) {
        var pt = toImg(p, e), last = cur.pts[cur.pts.length - 1];
        var dx = (pt[0] - last[0]) * nw, dy = (pt[1] - last[1]) * nh;
        if (Math.sqrt(dx * dx + dy * dy) >= Math.max(1, brush * 0.25)) cur.pts.push(pt);
        overlay();
      } else if (drag) {
        var s = scaleOf(p);
        cxn -= (e.clientX - drag.x) / (s * nw);
        cyn -= (e.clientY - drag.y) / (s * nh);
        drag.x = e.clientX; drag.y = e.clientY;
        if (space) spaceDragged = true;
        render();
      } else if (mode === 'heal') {
        overlay();
      }
    });
    function end(e) {
      if (e && e.pointerId !== undefined) delete ptrs[e.pointerId];
      if (Object.keys(ptrs).length < 2) pinch = null;
      p.classList.remove('drag');
      drag = null;
      if (cur) {
        lastEnd = { name: name, pt: cur.pts[cur.pts.length - 1] };
        pending.push(cur);
        cur = null;
        // always send every stroke that has not been confirmed yet, so nothing is lost
        sendValue({ id: uid(), name: name, strokes: pending.slice() });
        overlay();
      }
    }
    p.addEventListener('pointerup', end);
    p.addEventListener('pointercancel', end);
    p.addEventListener('pointerleave', function () { hover = [null, null]; if (mode === 'heal') overlay(); });
    p.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = p.getBoundingClientRect();
      zoomAt(z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    p.addEventListener('dblclick', function () { if (mode !== 'heal') { z = 1; render(); } });
  });

  function stepZoom(f) { var p = panes[0]; zoomAt(z * f, p, p.clientWidth / 2, p.clientHeight / 2); }
  document.getElementById('zi').onclick = function () { stepZoom(1.4); };
  document.getElementById('zo').onclick = function () { stepZoom(1 / 1.4); };
  document.getElementById('zr').onclick = function () { z = 1; render(); };

  function dims() {
    if (imgs[0].naturalWidth) { nw = imgs[0].naturalWidth; nh = imgs[0].naturalHeight; }
    render();
  }
  imgs[0].addEventListener('load', dims);
  imgs[1].addEventListener('load', dims);
  if (window.ResizeObserver) new ResizeObserver(render).observe(document.getElementById('wrap'));
  else window.addEventListener('resize', render);

  // Left / right arrow keys: previous / next photo.  Space + drag moves the picture while painting.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); sendValue({ id: uid(), nav: 1 }); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); sendValue({ id: uid(), nav: -1 }); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sendValue({ id: uid(), stone: 1 }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sendValue({ id: uid(), stone: -1 }); }
    else if (e.key === '[') { brush = Math.max(2, Math.round(brush / 1.2)); overlay(); }
    else if (e.key === ']') { brush = Math.min(400, Math.round(brush * 1.2) + 1); overlay(); }
    else if (e.key === ' ') { e.preventDefault(); spaceDown(); }
  });
  // Space: tap = flip Original / Edited, or hold = show Original while held (setting).
  // In the heal tool Space + drag only moves the picture.
  function spaceDown() {
    if (space) return;
    space = true; spaceDragged = false;
    if (spaceMode === 'hold') { holdActive = true; showEdited = false; applyFlip(); }
  }
  function spaceUp() {
    if (!space) return;
    space = false;
    if (holdActive) { holdActive = false; showEdited = true; applyFlip(); }
    else if (!spaceDragged) flip();
  }
  window.addEventListener('keyup', function (e) { if (e.key === ' ') { e.preventDefault(); spaceUp(); } });
  var fl = document.getElementById('fl');
  fl.onclick = function () { if (spaceMode !== 'hold') flip(); };
  fl.addEventListener('pointerdown', function () { if (spaceMode === 'hold') { holdActive = true; showEdited = false; applyFlip(); } });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
    fl.addEventListener(ev, function () { if (holdActive && !space) { holdActive = false; showEdited = true; applyFlip(); } });
  });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d) return;
    if (d.gemspace === 'down') spaceDown(); else if (d.gemspace === 'up') spaceUp();
  });
  // same arrow keys when the page (not the viewer) has focus
  try {
    var d = window.parent.document;
    var old = d.getElementById('gem-keys'); if (old) old.remove();
    if (!d.getElementById('gem-keys3')) {
      var s = d.createElement('script');
      s.id = 'gem-keys3';
      s.textContent =
        "(function(){if(window.__gemKeys)return;window.__gemKeys=1;" +
        "function skip(){var a=document.activeElement,t=a&&a.tagName;" +
        "return t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||(a&&a.getAttribute&&(a.getAttribute('role')==='slider'||a.isContentEditable));}" +
        "function tell(m){document.querySelectorAll('iframe').forEach(function(f){try{f.contentWindow.postMessage(m,'*');}catch(x){}});}" +
        "document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(b)setTimeout(function(){b.blur();},0);},true);" +
        "document.addEventListener('keydown',function(e){if(skip())return;" +
        "if(e.key===' '){e.preventDefault();if(!e.repeat)tell({gemspace:'down'});return;}" +
        "var k={ArrowRight:'next',ArrowLeft:'prev',ArrowDown:'nextstone',ArrowUp:'prevstone'}[e.key];if(!k)return;" +
        "var b=document.querySelector('.st-key-'+k+' button');if(b){e.preventDefault();b.click();}});" +
        "document.addEventListener('keyup',function(e){if(skip())return;if(e.key===' '){e.preventDefault();tell({gemspace:'up'});}});" +
        "})();";
      d.head.appendChild(s);
    }
  } catch (e) {}

  function onRender(a) {
    mode = a.mode === 'heal' ? 'heal' : 'pan';
    spaceMode = a.space_mode === 'hold' ? 'hold' : 'tap';
    document.body.classList.toggle('light', !!a.light);
    keepView = !!a.keep_view; startEdited = a.start_edited !== false;
    tag.style.display = a.show_tag === false ? 'none' : '';
    document.getElementById('note').textContent = a.note || '';
    var stn = document.getElementById('stn'); stn.textContent = a.stone_label || ''; stn.style.display = a.stone_label ? '' : 'none';
    document.getElementById('fl').textContent = spaceMode === 'hold' ? '\u2423 Hold: original' : '\u2423 Space: flip';
    if (a.brush !== argBrush) { argBrush = a.brush; brush = a.brush || 16; }
    seen = a.seen || [];
    panes.forEach(function (p) { p.classList.toggle('heal', mode === 'heal'); });
    hint.textContent = mode === 'heal'
      ? 'Paint over a spot. Shift+click = straight line. [ ] = brush size. Right-drag moves. Space = flip.'
      : (spaceMode === 'hold' ? 'Hold Space = see Original. ' : 'Space = flip Original / Edited. ') + 'Drag to move, scroll to zoom, double-click to reset.';
    if (a.name !== name) { name = a.name; if (!keepView) { z = 1; cxn = 0.5; cyn = 0.5; } pending = []; cur = null; lastEnd = null; showEdited = startEdited; }
    applyFlip();
    pending = pending.filter(function (s) { return seen.indexOf(s.sid) < 0; });
    if (a.orig_id !== origId) { origId = a.orig_id; imgs[0].src = 'data:image/jpeg;base64,' + a.orig; }
    if (a.edit_id !== editId) { editId = a.edit_id; imgs[1].src = 'data:image/jpeg;base64,' + a.edit; }
    document.getElementById('wrap').style.bottom = '38px';
    autoFit = !!a.auto_fit; fitOffset = a.fit_offset || 360; baseH = a.height || 520;
    applyHeight();
    render();
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.type === 'streamlit:render') onRender(d.args || {});
  });
  post({ type: 'streamlit:componentReady', apiVersion: 1 });
})();
</script>
</body>
</html>
